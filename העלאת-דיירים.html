async function addTenants() {
  const status = document.getElementById('status');
  status.innerHTML = '<p class="progress">מתחיל להעלות דיירים...</p>';
  
  let count = 0;
  let errors = 0;
  
  for (const tenant of tenants) {
    try {
      await addDoc(collection(db, 'tenants'), tenant);
      count++;
      if (count % 10 === 0) {
        status.innerHTML += `<p class="progress">✓ הועלו ${count}/${tenants.length} דיירים...</p>`;
      }
    } catch(e) {
      errors++;
      status.innerHTML += `<p class="error">✗ שגיאה בדייר: ${tenant.name} (קומה ${tenant.floor}, דירה ${tenant.apt})</p>`;
    }
  }
  
  status.innerHTML += `<h2 class="success">✓ סיום!</h2>`;
  status.innerHTML += `<p class="success">הועלו בהצלחה: ${count} דיירים</p>`;
  if (errors > 0) {
    status.innerHTML += `<p class="error">שגיאות: ${errors}</p>`;
  }
  status.innerHTML += '<p><strong>עכשיו תוכל לסגור דף זה ולרענן את מערכת הלובי/ניהול</strong></p>';
}
