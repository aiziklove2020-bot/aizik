<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דה וינצ'י — לובי</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body, html {
    font-family: 'Assistant', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

.main-bg {
    position: fixed;
    inset: 0;
    background-image: url('IMG_9285.jpeg');
    background-size: cover;
    background-position: center;
    z-index: -2;
}

.overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.2) 100%);
    z-index: -1;
}

/* Header */
.header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 24px;
    gap: 24px;
    flex-wrap: wrap;
}

.status-row {
    display: flex;
    gap: 16px;
}

.status-glass {
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 50%;
    width: 110px;
    height: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

.frosted-glass {
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 40px;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
}

.logo-box {
    padding: 20px 40px;
    text-align: center;
}

.logo-title {
    font-size: 48px;
    font-weight: 800;
    color: white;
    letter-spacing: -2px;
    font-style: italic;
    line-height: 1;
}

.logo-subtitle {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.9);
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.pulse-dot {
    width: 6px;
    height: 6px;
    background: #34d399;
    border-radius: 50%;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

/* Main */
.main-content {
    max-width: 1024px;
    margin: 0 auto;
    padding: 0 24px;
}

/* Cards */
.cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px;
    margin-top: 24px;
}

.frosted-card {
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 24px;
}

.action-card {
    cursor: pointer;
    padding: 24px;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.action-card:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: translateY(-4px);
}

.card-content {
    display: flex;
    align-items: center;
    gap: 16px;
}

.icon-wrapper {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.15);
}

.card-title {
    font-size: 20px;
    font-weight: 700;
    color: white;
    margin-bottom: 4px;
}

.card-desc {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.7);
}

.arrow-icon {
    width: 24px;
    height: 24px;
    color: rgba(255, 255, 255, 0.6);
}

/* Sections */
.section {
    display: none;
    margin-top: 24px;
}

.section.active {
    display: block;
}

.section-header {
    display: flex;
    align-items: center;
    margin-bottom: 24px;
    gap: 16px;
}

.back-btn {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    color: white;
    font-size: 20px;
    cursor: pointer;
    backdrop-filter: blur(10px);
}

.section-title {
    font-size: 32px;
    font-weight: 700;
    color: white;
}

/* Table */
table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: rgba(255, 255, 255, 0.1);
    padding: 12px;
    text-align: right;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 600;
}

td {
    padding: 16px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    color: white;
}

.badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(147, 197, 253, 0.2);
    color: #93c5fd;
    border: 1px solid rgba(147, 197, 253, 0.3);
}

.btn-icon {
    background: rgba(255, 255, 255, 0.1);
    border: none;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    font-size: 18px;
}

/* Modal */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 20px;
}

.modal-overlay.show {
    display: flex;
}

.modal-content {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(40px);
    border-radius: 32px;
    max-width: 500px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
}

.modal-header {
    padding: 24px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.modal-title {
    font-size: 24px;
    font-weight: 700;
    color: #1f2937;
}

.modal-close {
    background: rgba(0, 0, 0, 0.05);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    color: #6b7280;
}

.modal-body {
    padding: 24px;
}

.form-group {
    margin-bottom: 16px;
}

.form-label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 600;
    color: #374151;
}

.form-input, .form-select {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    font-size: 15px;
    font-family: 'Assistant', sans-serif;
    color: #1f2937;
    background: white;
}

.form-input:focus, .form-select:focus {
    outline: none;
    border-color: #3b82f6;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.form-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
}

.btn {
    flex: 1;
    padding: 14px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    font-family: 'Assistant', sans-serif;
}

.btn-cancel {
    background: #f3f4f6;
    color: #6b7280;
}

.btn-submit {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
}

/* Toast */
.toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    color: #1f2937;
    padding: 16px 32px;
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    transition: transform 0.3s;
    z-index: 99999;
    font-weight: 600;
}

.toast.show {
    transform: translateX(-50%) translateY(0);
}

@media (max-width: 768px) {
    .header {
        flex-direction: column;
        align-items: center;
    }
    
    .form-row {
        grid-template-columns: 1fr;
    }
    
    .cards-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>

<div class="main-bg"></div>
<div class="overlay"></div>

<div style="position: relative; z-index: 10; min-height: 100vh; padding: 24px;">
    
    <!-- Header -->
    <header class="header">
        <div class="status-row">
            <div class="status-glass">
                <span style="font-size: 12px; opacity: 1; font-weight: 700; color: white;">אורחים היום</span>
                <span style="font-size: 32px; font-weight: 900; color: #fbbf24; text-shadow: 0 2px 8px rgba(0,0,0,0.3);" id="sToday">0</span>
            </div>
            <div class="status-glass">
                <span style="font-size: 12px; opacity: 1; font-weight: 700; color: white;">דיירים</span>
                <span style="font-size: 32px; font-weight: 900; color: #34d399; text-shadow: 0 2px 8px rgba(0,0,0,0.3);" id="sTen">0</span>
            </div>
        </div>
        <div class="frosted-glass logo-box">
            <h1 class="logo-title">DA VINCI</h1>
            <p class="logo-subtitle">
                <span class="pulse-dot"></span>
                לובי • <span id="clk" style="font-size: 16px; font-weight: 900; color: #fbbf24;">14:32</span>
            </p>
        </div>
    </header>

    <div class="main-content">
        <!-- תפריט ראשי -->
        <div id="mainMenu" class="section active">
            <div class="cards-grid">
                
                <div class="frosted-card action-card" onclick="openRegModal()">
                    <div class="card-content">
                        <div class="icon-wrapper">
                            <svg style="width: 28px; height: 28px; color: #93c5fd;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
                            </svg>
                        </div>
                        <div>
                            <h2 class="card-title">רישום אורח חדש</h2>
                            <p class="card-desc">הוסף כניסת אורח למערכת</p>
                        </div>
                    </div>
                    <svg class="arrow-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>

                <div class="frosted-card action-card" onclick="showSection('list')">
                    <div class="card-content">
                        <div class="icon-wrapper" style="background: rgba(196, 181, 253, 0.15);">
                            <svg style="width: 28px; height: 28px; color: #c4b5fd;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                            </svg>
                        </div>
                        <div>
                            <h2 class="card-title">רשימת כניסות</h2>
                            <p class="card-desc">צפה ברישומים קיימים</p>
                        </div>
                    </div>
                    <svg class="arrow-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>

            </div>
        </div>

        <!-- רשימת אורחים -->
        <div id="listSection" class="section">
            <div class="section-header">
                <button class="back-btn" onclick="showSection('main')">←</button>
                <h2 class="section-title">רשימת כניסות</h2>
            </div>
            <div class="frosted-card" style="padding: 24px; overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>שם</th>
                            <th>אצל דייר</th>
                            <th>קומה</th>
                            <th>דירה</th>
                            <th>קטגוריה</th>
                            <th>תאריך</th>
                            <th>שעה</th>
                            <th>נרשם ע"י</th>
                            <th>פעולות</th>
                        </tr>
                    </thead>
                    <tbody id="guestsTbody">
                        <tr><td colspan="9" style="text-align: center; opacity: 0.6; padding: 32px;">אין רישומים</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- MODAL רישום -->
<div id="regModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">רישום אורח חדש</h3>
            <button class="modal-close" onclick="closeRegModal()">✕</button>
        </div>
        <form id="gForm" class="modal-body">
            <div class="form-group">
                <label class="form-label">שם אורח *</label>
                <input type="text" id="gN" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">חפש דייר או הקלד ידנית *</label>
                <input type="text" id="tenantSearch" class="form-input" placeholder="הקלד שם דייר..." list="tenantList">
                <datalist id="tenantList"></datalist>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">קומה *</label>
                    <input type="number" id="gFloor" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">דירה *</label>
                    <input type="text" id="gApt" class="form-input" required>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">קטגוריה *</label>
                <select id="gCat" class="form-input" required onchange="toggleOther()">
                    <option value="">בחר...</option>
                    <option>אורח פרטי</option>
                    <option>ספק/טכנאי</option>
                    <option>משלוח</option>
                    <option>אחר</option>
                </select>
            </div>
            
            <div class="form-group" id="otherWrap" style="display: none;">
                <label class="form-label">פרט את הקטגוריה *</label>
                <input type="text" id="otherText" class="form-input" placeholder="לדוגמה: קבלן, רופא...">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">תאריך *</label>
                    <input type="date" id="gDt" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">שעה *</label>
                    <input type="time" id="gTm" class="form-input" required>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">נרשם ע"י *</label>
                <select id="gEmployee" class="form-input" required>
                    <option value="">בחר...</option>
                </select>
            </div>
            
            <div class="form-actions">
                <button type="button" class="btn btn-cancel" onclick="closeRegModal()">ביטול</button>
                <button type="submit" class="btn btn-submit">שמור</button>
            </div>
        </form>
    </div>
</div>

<div class="toast" id="toastEl"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBfnYW-d4UFVvuqdxCLk_autpWmOLL2zFo",
  authDomain: "leonrdi-de-vinhi.firebaseapp.com",
  projectId: "leonrdi-de-vinhi",
  storageBucket: "leonrdi-de-vinhi.firebasestorage.app",
  messagingSenderId: "287853664744",
  appId: "1:287853664744:web:3812f47e80da3ef5e12c5d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const TODAY = new Date().toISOString().split('T')[0];

let guests = [], tenants = [], employees = [];

function toast(msg) {
  const el = document.getElementById('toastEl');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function updateClock() {
  document.getElementById('clk').textContent = new Date().toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

async function loadData() {
  try {
    const gSnap = await getDocs(collection(db, 'guests'));
    guests = gSnap.docs.map(d => ({id: d.id, ...d.data()}))
      .sort((a, b) => {
        if (a.date !== b.date) return (b.date || '').localeCompare(a.date || '');
        return (b.time || '').localeCompare(a.time || '');
      });
    document.getElementById('sToday').textContent = guests.filter(g => g.date === TODAY).length;
    renderGuests();
  } catch(e) { console.error(e); }

  try {
    const tSnap = await getDocs(collection(db, 'tenants'));
    tenants = tSnap.docs.map(d => ({id: d.id, ...d.data()}));
    document.getElementById('sTen').textContent = tenants.length;
    
    // עדכן רשימת דיירים ב-datalist
    const datalist = document.getElementById('tenantList');
    datalist.innerHTML = tenants.map(t => 
      `<option value="${t.name}" data-floor="${t.floor}" data-apt="${t.apt}">`
    ).join('');
  } catch(e) { console.error(e); }

  try {
    const eSnap = await getDocs(collection(db, 'employees'));
    employees = eSnap.docs.map(d => ({id: d.id, ...d.data()}));
    const select = document.getElementById('gEmployee');
    select.innerHTML = '<option value="">בחר...</option>' + 
      employees.map(e => `<option>${e.name}</option>`).join('');
  } catch(e) { console.error(e); }
}

function renderGuests() {
  const tbody = document.getElementById('guestsTbody');
  if(!guests.length) { 
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;opacity:0.6;padding:32px">אין רישומים</td></tr>'; 
    return; 
  }
  tbody.innerHTML = guests.map(g => `
    <tr>
      <td>${g.name}</td>
      <td>${g.tname || '—'}</td>
      <td>${g.floor || '—'}</td>
      <td>${g.apt || '—'}</td>
      <td><span class="badge">${g.cat}</span></td>
      <td>${g.date}</td>
      <td>${g.time}</td>
      <td>${g.registeredBy||'—'}</td>
      <td><button class="btn-icon" onclick="deleteGuest('${g.id}')">🗑</button></td>
    </tr>
  `).join('');
}

window.deleteGuest = async (id) => {
  if(!confirm('למחוק רישום זה?')) return;
  try {
    await deleteDoc(doc(db, 'guests', id));
    toast('נמחק בהצלחה');
    loadData();
  } catch(e) {
    toast('שגיאה במחיקה');
  }
};

window.openRegModal = () => {
  document.getElementById('gDt').value = TODAY;
  document.getElementById('gTm').value = new Date().toTimeString().slice(0,5);
  document.getElementById('regModal').classList.add('show');
};

window.closeRegModal = () => {
  document.getElementById('regModal').classList.remove('show');
  document.getElementById('gForm').reset();
  document.getElementById('otherWrap').style.display = 'none';
};

window.toggleOther = () => {
  const cat = document.getElementById('gCat').value;
  const wrap = document.getElementById('otherWrap');
  const input = document.getElementById('otherText');
  if (cat === 'אחר') {
    wrap.style.display = 'block';
    input.required = true;
  } else {
    wrap.style.display = 'none';
    input.required = false;
    input.value = '';
  }
};

// כשבוחרים דייר מהרשימה - מלא אוטומטית קומה/דירה
document.getElementById('tenantSearch').addEventListener('input', (e) => {
  const value = e.target.value;
  const tenant = tenants.find(t => t.name === value);
  if (tenant) {
    document.getElementById('gFloor').value = tenant.floor;
    document.getElementById('gApt').value = tenant.apt;
  }
});

document.getElementById('gForm').onsubmit = async (e) => {
  e.preventDefault();
  const tenantName = document.getElementById('tenantSearch').value.trim();
  
  let category = document.getElementById('gCat').value;
  if (category === 'אחר') {
    const other = document.getElementById('otherText').value.trim();
    if (other) category = 'אחר - ' + other;
  }
  
  const data = {
    name: document.getElementById('gN').value.trim(),
    tname: tenantName || 'לובי',
    floor: parseInt(document.getElementById('gFloor').value) || 0,
    apt: document.getElementById('gApt').value.trim() || 'לובי',
    cat: category,
    date: document.getElementById('gDt').value,
    time: document.getElementById('gTm').value,
    registeredBy: document.getElementById('gEmployee').value
  };
  try {
    await addDoc(collection(db, 'guests'), data);
    toast('אורח נרשם בהצלחה ✓');
    closeRegModal();
    loadData();
  } catch(e) {
    toast('שגיאה בשמירה');
  }
};

window.showSection = (sec) => {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  if(sec === 'main') document.getElementById('mainMenu').classList.add('active');
  else if(sec === 'list') document.getElementById('listSection').classList.add('active');
};

loadData();
</script>

</body>
</html>
