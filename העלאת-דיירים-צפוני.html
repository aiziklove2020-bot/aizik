const log = (m, c='info') => {
  const el = document.getElementById('log');
  el.innerHTML += '<div class="'+c+'">'+m+'</div>';
  el.scrollTop = el.scrollHeight;
};

(async () => {
  try {
    // מחק רק דיירי מגדל צפוני קיימים
    log('מוחק דיירי מגדל צפוני קיימים...', 'info');
    const all = await getDocs(collection(db, 'tenants'));
    let deleted = 0;
    for (const d of all.docs) {
      const data = d.data();
      if (data.tower === 'צפוני') {
        await deleteDoc(doc(db, 'tenants', d.id));
        deleted++;
      }
    }
    log('נמחקו ' + deleted + ' דיירי צפוני ישנים', 'info');

    let ok = 0;
    document.getElementById('status').textContent = 'מעלה דיירים...';
    
    for (let i = 0; i < TENANTS.length; i++) {
      try {
        await addDoc(collection(db, 'tenants'), TENANTS[i]);
        ok++;
        document.getElementById('num').textContent = ok;
        document.getElementById('bar').style.width = Math.round(ok / TENANTS.length * 100) + '%';
        document.getElementById('status').textContent = ok + ' / ' + TENANTS.length;
        log('✓ קומה ' + TENANTS[i].floor + ' | דירה ' + TENANTS[i].apt + ' | ' + TENANTS[i].name, 'ok');
      } catch(e) {
        log('✗ ' + TENANTS[i].name + ': ' + e.message, 'err');
      }
    }
    
    document.getElementById('status').textContent = '✅ הושלם! ' + ok + ' דיירי מגדל צפוני הועלו';
    document.getElementById('bar').style.width = '100%';
    log('✅ סיום — ' + ok + ' דיירים הועלו בהצלחה', 'ok');
    log('עכשיו יש בלובי דיירי דרומי + צפוני!', 'ok');
  } catch(e) {
    document.getElementById('status').textContent = '❌ שגיאה: ' + e.message;
    log('❌ ' + e.message, 'err');
  }
})();
