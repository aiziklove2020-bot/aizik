async function uploadTenants() {
  const status = document.getElementById('status');
  status.innerHTML = '<p class="progress">מתחבר ל-Firebase...</p>';
  
  let count = 0;
  let errors = 0;
  
  try {
    for (const tenant of tenants) {
      try {
        await addDoc(collection(db, 'tenants'), tenant);
        count++;
        if (count % 10 === 0) {
          status.innerHTML += `<p class="progress">✓ הועלו ${count}/${tenants.length} דיירים...</p>`;
        }
      } catch(e) {
        errors++;
        status.innerHTML += `<p class="error">✗ שגיאה: ${tenant.name}</p>`;
      }
    }
    
    status.innerHTML += `<h2 class="success">✅ הושלם!</h2>`;
    status.innerHTML += `<p>נוספו ${count} דיירים בהצלחה!</p>`;
    if (errors > 0) {
      status.innerHTML += `<p class="error">${errors} שגיאות</p>`;
    }
    status.innerHTML += '<p><strong>עכשיו אפשר לסגור דף זה ולרענן את מערכת הניהול</strong></p>';
  } catch(e) {
    status.innerHTML += `<p class="error">שגיאה כללית: ${e.message}</p>`;
  }
}

uploadTenants();
