<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יצירת מנהלים — דה וינצ'י</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #111; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.box { background: #1c1c1c; border-radius: 20px; padding: 40px; width: 100%; max-width: 480px; }
h1 { color: #f59e0b; font-size: 24px; margin-bottom: 8px; text-align: center; }
.sub { color: #888; font-size: 13px; text-align: center; margin-bottom: 30px; }
.group { margin-bottom: 16px; }
label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; font-weight: 600; }
input { width: 100%; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; padding: 12px 14px; color: white; font-size: 15px; outline: none; direction: ltr; }
input:focus { border-color: #f59e0b; }
.btn { width: 100%; background: #f59e0b; color: #111; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 20px; }
.btn:hover { background: #fbbf24; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.divider { border: none; border-top: 1px solid #333; margin: 24px 0; }
.log { background: #000; border-radius: 10px; padding: 14px; min-height: 120px; max-height: 220px; overflow-y: auto; font-size: 13px; font-family: monospace; line-height: 2; margin-top: 20px; }
.ok  { color: #22c55e; }
.err { color: #ef4444; }
.info { color: #888; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
th { background: #2a2a2a; padding: 8px 12px; text-align: right; color: #888; }
td { padding: 10px 12px; border-bottom: 1px solid #2a2a2a; }
.badge { background: rgba(245,158,11,0.2); color: #f59e0b; border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
</style>
</head>
<body>
<div class="box">
  <h1>🔐 הגדרת מנהלים</h1>
  <p class="sub">דה וינצ'י — צור משתמש ניהול חדש</p>

  <div class="group">
    <label>אימייל המנהל</label>
    <input type="email" id="email" placeholder="admin@davinci.com" value="admin1@davinci.com">
  </div>
  <div class="group">
    <label>סיסמה (מינימום 6 תווים)</label>
    <input type="password" id="pass" placeholder="סיסמה" value="admin1234">
  </div>
  <div class="group">
    <label>שם מלא</label>
    <input type="text" id="uname" placeholder="שם המנהל" value="מנהל ראשי">
  </div>

  <button class="btn" id="createBtn" onclick="createAdmin()">🚀 צור מנהל</button>

  <hr class="divider">

  <p style="color:#888;font-size:13px;margin-bottom:8px;">מנהלים קיימים:</p>
  <table>
    <thead><tr><th>אימייל</th><th>שם</th><th>תפקיד</th></tr></thead>
    <tbody id="adminsList">
      <tr><td colspan="3" style="color:#555;text-align:center;padding:16px">טוען...</td></tr>
    </tbody>
  </table>

  <div class="log" id="log">ממתין לפעולה...</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, setDoc, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyBfnYW-d4UFVvuqdxCLk_autpWmOLL2zFo",
  authDomain: "leonrdi-de-vinhi.firebaseapp.com",
  projectId: "leonrdi-de-vinhi",
  storageBucket: "leonrdi-de-vinhi.firebasestorage.app",
  messagingSenderId: "287853664744",
  appId: "1:287853664744:web:3812f47e80da3ef5e12c5d"
});

const auth = getAuth(app);
const db   = getFirestore(app);

function log(msg, type='info') {
  const el = document.getElementById('log');
  el.innerHTML += '<div class="' + type + '">' + msg + '</div>';
  el.scrollTop = el.scrollHeight;
}

async function loadAdmins() {
  try {
    const snap = await getDocs(collection(db, 'admins'));
    const tbody = document.getElementById('adminsList');
    if (snap.empty) {
      tbody.innerHTML = '<tr><td colspan="3" style="color:#555;text-align:center;padding:16px">אין מנהלים עדיין</td></tr>';
      return;
    }
    tbody.innerHTML = snap.docs.map(d => {
      const u = d.data();
      return '<tr>' +
        '<td style="direction:ltr;font-size:12px">' + (u.email || d.id) + '</td>' +
        '<td>' + (u.name || '—') + '</td>' +
        '<td><span class="badge">מנהל</span></td>' +
        '</tr>';
    }).join('');
  } catch(e) {
    document.getElementById('adminsList').innerHTML =
      '<tr><td colspan="3" style="color:#555;text-align:center">לא ניתן לטעון — בדוק חיבור</td></tr>';
  }
}

loadAdmins();

window.createAdmin = async () => {
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('pass').value.trim();
  const name  = document.getElementById('uname').value.trim();

  if (!email || !pass || !name) { log('❌ מלא את כל השדות', 'err'); return; }
  if (pass.length < 6) { log('❌ סיסמה חייבת להיות לפחות 6 תווים', 'err'); return; }

  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  document.getElementById('log').innerHTML = '';

  log('⏳ יוצר משתמש ב-Firebase...', 'info');

  try {
    // צור ב-Auth
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    log('✅ משתמש נוצר ב-Firebase Auth', 'ok');

    // שמור ב-Firestore collection admins
    await setDoc(doc(db, 'admins', cred.user.uid), {
      email:     email,
      name:      name,
      role:      'admin',
      createdAt: new Date().toISOString()
    });
    log('✅ נשמר ב-Firestore collection admins', 'ok');
    log('━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
    log('🎉 מנהל נוצר בהצלחה!', 'ok');
    log('📧 אימייל: ' + email, 'ok');
    log('🔑 סיסמה: ' + pass, 'ok');
    log('━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
    log('עכשיו כנס ל-admin.html עם פרטים אלה', 'info');

    await loadAdmins();
  } catch(e) {
    if (e.code === 'auth/email-already-in-use') {
      log('⚠️ אימייל זה כבר קיים במערכת', 'info');
      log('נסה להיכנס ל-admin.html עם הסיסמה הקיימת', 'info');
      log('אם שכחת סיסמה — שנה אימייל וצור מנהל חדש', 'info');
    } else if (e.code === 'auth/invalid-email') {
      log('❌ אימייל לא תקין', 'err');
    } else if (e.code === 'auth/weak-password') {
      log('❌ סיסמה חלשה — הוסף תווים', 'err');
    } else {
      log('❌ שגיאה: ' + e.message, 'err');
    }
  }

  btn.disabled = false;
};
</script>
</body>
</html>
