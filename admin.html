<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דה וינצ'י — ניהול</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap');

body, html { margin: 0; padding: 0; min-height: 100vh; font-family: 'Assistant', sans-serif; }

.main-bg {
    position: fixed; inset: 0;
    background-image: url('IMG_9285.jpeg');
    background-size: cover; background-position: center; z-index: -2;
}

.overlay {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.2) 100%);
    z-index: -1;
}

.frosted-glass {
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 40px;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
}

.frosted-card {
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 24px;
}

.status-glass {
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border-radius: 20px; padding: 20px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    text-align: center;
}

.tab-btn {
    padding: 14px 28px; border-radius: 20px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: white; font-weight: 600; cursor: pointer;
    transition: all 0.3s;
}

.tab-btn.active {
    background: rgba(255,255,255,0.3);
    border-color: rgba(255,255,255,0.4);
}

.inp {
    width: 100%; background: rgba(255,255,255,0.6);
    border: 1px solid rgba(0,0,0,0.1); border-radius: 16px;
    padding: 14px 16px; font-size: 15px;
    color: #333; outline: none;
}

.sbtn {
    background: linear-gradient(135deg, #4a90e2, #357abd);
    color: white; border: none; padding: 16px 32px; border-radius: 20px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 8px 20px rgba(74,144,226,0.3);
}

.toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
    color: #333; padding: 16px 32px; border-radius: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transition: transform 0.3s; z-index: 99999;
}

.toast.show { transform: translateX(-50%) translateY(0); }

table { width: 100%; border-collapse: collapse; }
th { background: rgba(255,255,255,0.1); padding: 12px; text-align: right; font-size: 12px; }
td { padding: 14px 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }

.modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px); display: none;
    align-items: center; justify-content: center; z-index: 9999; padding: 20px;
}
.modal-overlay.show { display: flex; }

.modal-content {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(40px); border-radius: 32px;
    max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto;
}

.section { display: none; }
.section.active { display: block; }

#app { display: none; }
#app.show { display: block; }
</style>
</head>
<body class="text-white">

<div class="main-bg"></div>
<div class="overlay"></div>

<!-- התחברות -->
<div id="login" class="fixed inset-0 flex items-center justify-center p-6 z-50">
    <div class="frosted-glass p-10 max-w-sm w-full">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold italic tracking-tighter mb-2">DA VINCI</h1>
            <p class="text-sm opacity-70">פאנל ניהול</p>
        </div>
        <div class="space-y-4">
            <input type="email" id="loginEmail" class="inp" placeholder="אימייל">
            <input type="password" id="loginPass" class="inp" placeholder="סיסמה">
            <div id="loginErr" class="text-red-300 text-sm text-center min-h-6"></div>
            <button id="loginBtn" class="sbtn w-full">כניסה</button>
        </div>
    </div>
</div>

<!-- אפליקציה -->
<div id="app" class="relative z-10 min-h-screen p-6">
    
    <header class="flex justify-between items-start mb-10 pt-4 max-w-6xl mx-auto">
        <div class="frosted-glass p-5 px-8 text-left">
            <h1 class="text-2xl font-extrabold italic tracking-tighter leading-none mb-1">DA VINCI</h1>
            <p class="text-[9px] uppercase tracking-widest font-bold text-orange-300 flex items-center gap-1">
                <span class="w-1.5 h-1.5 bg-orange-400 rounded-full animate-pulse"></span>
                ניהול מערכת
            </p>
        </div>
        <div class="flex gap-4">
            <button onclick="auth.signOut()" class="frosted-card px-6 py-3 text-sm font-bold hover:bg-white/30">יציאה</button>
        </div>
    </header>

    <div class="max-w-6xl mx-auto">
        
        <!-- טאבים -->
        <div class="frosted-card p-4 mb-8 flex gap-3">
            <button class="tab-btn active" onclick="showTab('dashboard')">דשבורד</button>
            <button class="tab-btn" onclick="showTab('guests')">אורחים</button>
            <button class="tab-btn" onclick="showTab('tenants')">דיירים</button>
            <button class="tab-btn" onclick="showTab('offices')">משרדים</button>
        </div>

        <!-- דשבורד -->
        <div id="dashboard" class="section active">
            <div class="grid grid-cols-4 gap-6 mb-8">
                <div class="status-glass">
                    <div class="text-4xl font-bold" id="statGuests">0</div>
                    <div class="text-sm opacity-70 mt-2">אורחים היום</div>
                </div>
                <div class="status-glass">
                    <div class="text-4xl font-bold text-green-300" id="statTenants">0</div>
                    <div class="text-sm opacity-70 mt-2">דיירים</div>
                </div>
                <div class="status-glass">
                    <div class="text-4xl font-bold text-blue-300" id="statOffices">0</div>
                    <div class="text-sm opacity-70 mt-2">משרדים</div>
                </div>
                <div class="status-glass">
                    <div class="text-4xl font-bold text-orange-300">42</div>
                    <div class="text-sm opacity-70 mt-2">קומות</div>
                </div>
            </div>
            
            <div class="frosted-card p-8">
                <h2 class="text-2xl font-bold mb-6">פעולות מהירות</h2>
                <div class="grid grid-cols-3 gap-4">
                    <button onclick="showTab('guests')" class="p-6 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/20 font-bold">
                        📋 ניהול אורחים
                    </button>
                    <button onclick="showTab('tenants')" class="p-6 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/20 font-bold">
                        👥 ניהול דיירים
                    </button>
                    <button onclick="showTab('offices')" class="p-6 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/20 font-bold">
                        🏢 ניהול משרדים
                    </button>
                </div>
            </div>
        </div>

        <!-- אורחים -->
        <div id="guests" class="section">
            <div class="frosted-card p-6 overflow-x-auto">
                <h2 class="text-2xl font-bold mb-4">רשימת אורחים</h2>
                <table>
                    <thead><tr><th>שם</th><th>קטגוריה</th><th>תאריך</th><th>שעה</th><th>נרשם ע"י</th><th>פעולות</th></tr></thead>
                    <tbody id="guestsTbody"></tbody>
                </table>
            </div>
        </div>

        <!-- דיירים -->
        <div id="tenants" class="section">
            <div class="frosted-card p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">דיירים</h2>
                    <button onclick="openAddTenant()" class="sbtn">+ הוסף דייר</button>
                </div>
                <table>
                    <thead><tr><th>שם</th><th>קומה</th><th>דירה</th><th>טלפון</th><th>פעולות</th></tr></thead>
                    <tbody id="tenantsTbody"></tbody>
                </table>
            </div>
        </div>

        <!-- משרדים -->
        <div id="offices" class="section">
            <div class="frosted-card p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">משרדים</h2>
                    <button onclick="openAddOffice()" class="sbtn">+ הוסף משרד</button>
                </div>
                <table>
                    <thead><tr><th>קומה</th><th>שם משרד/חברה</th><th>פעולות</th></tr></thead>
                    <tbody id="officesTbody"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- MODAL הוסף דייר -->
<div id="addTenantModal" class="modal-overlay">
    <div class="modal-content text-gray-800">
        <div class="p-6 border-b">
            <div class="flex justify-between items-center">
                <h3 class="text-2xl font-bold">הוסף דייר</h3>
                <button onclick="closeAddTenant()" class="w-10 h-10 rounded-full bg-gray-200">✕</button>
            </div>
        </div>
        <form id="tenantForm" class="p-6 space-y-4">
            <div><label class="block text-sm font-bold mb-2">שם מלא *</label><input type="text" id="tName" class="inp" required></div>
            <div class="grid grid-cols-2 gap-4">
                <div><label class="block text-sm font-bold mb-2">קומה *</label><input type="number" id="tFloor" class="inp" required></div>
                <div><label class="block text-sm font-bold mb-2">דירה *</label><input type="text" id="tApt" class="inp" required></div>
            </div>
            <div><label class="block text-sm font-bold mb-2">טלפון</label><input type="text" id="tPhone" class="inp"></div>
            <div class="flex gap-3 pt-4">
                <button type="button" onclick="closeAddTenant()" class="flex-1 py-4 rounded-2xl bg-gray-200 font-bold">ביטול</button>
                <button type="submit" class="flex-1 sbtn">שמור</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL הוסף משרד -->
<div id="addOfficeModal" class="modal-overlay">
    <div class="modal-content text-gray-800">
        <div class="p-6 border-b">
            <div class="flex justify-between items-center">
                <h3 class="text-2xl font-bold">הוסף משרד</h3>
                <button onclick="closeAddOffice()" class="w-10 h-10 rounded-full bg-gray-200">✕</button>
            </div>
        </div>
        <form id="officeForm" class="p-6 space-y-4">
            <div><label class="block text-sm font-bold mb-2">קומה *</label><input type="number" id="oFloor" class="inp" required></div>
            <div><label class="block text-sm font-bold mb-2">שם משרד/חברה *</label><input type="text" id="oName" class="inp" required></div>
            <div class="flex gap-3 pt-4">
                <button type="button" onclick="closeAddOffice()" class="flex-1 py-4 rounded-2xl bg-gray-200 font-bold">ביטול</button>
                <button type="submit" class="flex-1 sbtn">שמור</button>
            </div>
        </form>
    </div>
</div>

<div class="toast" id="toastEl"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBfnYW-d4UFVvuqdxCLk_autpWmOLL2zFo",
  authDomain: "leonrdi-de-vinhi.firebaseapp.com",
  projectId: "leonrdi-de-vinhi",
  storageBucket: "leonrdi-de-vinhi.firebasestorage.app",
  messagingSenderId: "287853664744",
  appId: "1:287853664744:web:3812f47e80da3ef5e12c5d"
};

const app = initializeApp(firebaseConfig);
window.auth = getAuth(app);
const db = getFirestore(app);
const TODAY = new Date().toISOString().split('T')[0];

let guests = [], tenants = [], offices = [];

function toast(msg) {
  const el = document.getElementById('toastEl');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

document.getElementById('loginBtn').onclick = async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  err.textContent = '';
  if(!email || !pass) { err.textContent = 'נא למלא שדות'; return; }
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    err.textContent = 'שגיאה בהתחברות';
  }
};

onAuthStateChanged(auth, user => {
  if(user) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').classList.add('show');
    loadData();
  }
});

async function loadData() {
  try {
    const gSnap = await getDocs(collection(db, 'guests'));
    guests = gSnap.docs.map(d => ({id: d.id, ...d.data()}));
    document.getElementById('statGuests').textContent = guests.filter(g => g.date === TODAY).length;
    renderGuests();
    
    const tSnap = await getDocs(collection(db, 'tenants'));
    tenants = tSnap.docs.map(d => ({id: d.id, ...d.data()}));
    document.getElementById('statTenants').textContent = tenants.length;
    renderTenants();
    
    const oSnap = await getDocs(collection(db, 'offices'));
    offices = oSnap.docs.map(d => ({id: d.id, ...d.data()}));
    document.getElementById('statOffices').textContent = offices.length;
    renderOffices();
  } catch(e) {
    console.error(e);
  }
}

function renderGuests() {
  const tbody = document.getElementById('guestsTbody');
  if(!guests.length) { tbody.innerHTML = '<tr><td colspan="6" class="text-center opacity-60">אין</td></tr>'; return; }
  tbody.innerHTML = guests.map(g => `
    <tr>
      <td>${g.name}</td>
      <td>${g.cat}</td>
      <td>${g.date}</td>
      <td>${g.time}</td>
      <td>${g.registeredBy||'—'}</td>
      <td><button onclick="delGuest('${g.id}')" class="text-red-400">🗑</button></td>
    </tr>
  `).join('');
}

window.delGuest = async (id) => {
  if(!confirm('למחוק?')) return;
  try {
    await deleteDoc(doc(db, 'guests', id));
    toast('נמחק');
    loadData();
  } catch(e) {
    toast('שגיאה');
  }
};

function renderTenants() {
  const tbody = document.getElementById('tenantsTbody');
  if(!tenants.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center opacity-60">אין</td></tr>'; return; }
  tbody.innerHTML = tenants.map(t => `
    <tr>
      <td>${t.name}</td>
      <td>${t.floor}</td>
      <td>${t.apt}</td>
      <td>${t.phone||'—'}</td>
      <td><button onclick="delTenant('${t.id}')" class="text-red-400">🗑</button></td>
    </tr>
  `).join('');
}

window.delTenant = async (id) => {
  if(!confirm('למחוק?')) return;
  try {
    await deleteDoc(doc(db, 'tenants', id));
    toast('נמחק');
    loadData();
  } catch(e) {
    toast('שגיאה');
  }
};

function renderOffices() {
  const tbody = document.getElementById('officesTbody');
  if(!offices.length) { tbody.innerHTML = '<tr><td colspan="3" class="text-center opacity-60">אין</td></tr>'; return; }
  tbody.innerHTML = offices.map(o => `
    <tr>
      <td>קומה ${o.floor}</td>
      <td>${o.name}</td>
      <td><button onclick="delOffice('${o.id}')" class="text-red-400">🗑</button></td>
    </tr>
  `).join('');
}

window.delOffice = async (id) => {
  if(!confirm('למחוק?')) return;
  try {
    await deleteDoc(doc(db, 'offices', id));
    toast('נמחק');
    loadData();
  } catch(e) {
    toast('שגיאה');
  }
};

window.showTab = (tab) => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(tab).classList.add('active');
};

window.openAddTenant = () => document.getElementById('addTenantModal').classList.add('show');
window.closeAddTenant = () => {
  document.getElementById('addTenantModal').classList.remove('show');
  document.getElementById('tenantForm').reset();
};

document.getElementById('tenantForm').onsubmit = async (e) => {
  e.preventDefault();
  const data = {
    name: document.getElementById('tName').value.trim(),
    floor: parseInt(document.getElementById('tFloor').value),
    apt: document.getElementById('tApt').value.trim(),
    phone: document.getElementById('tPhone').value.trim()
  };
  try {
    await addDoc(collection(db, 'tenants'), data);
    toast('נוסף בהצלחה');
    closeAddTenant();
    loadData();
  } catch(e) {
    toast('שגיאה');
  }
};

window.openAddOffice = () => document.getElementById('addOfficeModal').classList.add('show');
window.closeAddOffice = () => {
  document.getElementById('addOfficeModal').classList.remove('show');
  document.getElementById('officeForm').reset();
};

document.getElementById('officeForm').onsubmit = async (e) => {
  e.preventDefault();
  const data = {
    floor: parseInt(document.getElementById('oFloor').value),
    name: document.getElementById('oName').value.trim()
  };
  try {
    await addDoc(collection(db, 'offices'), data);
    toast('נוסף בהצלחה');
    closeAddOffice();
    loadData();
  } catch(e) {
    toast('שגיאה');
  }
};

</script>
</body>
</html>
